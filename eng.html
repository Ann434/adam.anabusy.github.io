
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة معاني الكلمات الإنجليزية</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .game {
        width: 95%;
        max-width: 650px;
        background: white;
        border-radius: 25px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
        color: #1769aa;
        margin-top: 0;
    }

    .info {
        display: flex;
        justify-content: space-between;
        background: #eef8ff;
        padding: 12px 18px;
        border-radius: 15px;
        margin-bottom: 25px;
        font-weight: bold;
    }

    .word {
        font-size: 42px;
        font-weight: bold;
        color: #222;
        margin: 25px 0;
    }

    .question {
        font-size: 21px;
        margin-bottom: 20px;
        color: #555;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    button {
        border: none;
        border-radius: 15px;
        padding: 18px;
        font-size: 20px;
        cursor: pointer;
        background: #e8f4ff;
        color: #1769aa;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover {
        background: #cdeaff;
        transform: scale(1.03);
    }

    button.correct {
        background: #4caf50;
        color: white;
    }

    button.wrong {
        background: #f44336;
        color: white;
    }

    #nextBtn {
        margin-top: 25px;
        background: #1769aa;
        color: white;
        width: 100%;
        display: none;
    }

    #nextBtn:hover {
        background: #0d4f80;
    }

    .result {
        display: none;
    }

    .result h2 {
        color: #1769aa;
        font-size: 32px;
    }

    .restart {
        background: #ff9800;
        color: white;
        width: 100%;
        margin-top: 20px;
    }

    .stars {
        font-size: 45px;
        margin: 20px;
    }

    @media (max-width: 550px) {
        .answers {
            grid-template-columns: 1fr;
        }

        .word {
            font-size: 34px;
        }
    }
</style>
</head>

<body>

<div class="game">

    <div id="gameScreen">

        <h1>🎯 معاني الكلمات الإنجليزية</h1>

        <div class="info">
            <span>السؤال: <span id="questionNumber">1</span>/20</span>
            <span>النقاط: <span id="score">0</span></span>
        </div>

        <div class="question">
            ما معنى الكلمة التالية؟
        </div>

        <div class="word" id="word">Apple</div>

        <div class="answers" id="answers"></div>

        <button id="nextBtn" onclick="nextQuestion()">السؤال التالي ➡️</button>

    </div>

    <div class="result" id="resultScreen">

        <h1>🎉 انتهت اللعبة!</h1>

        <div class="stars" id="stars">⭐⭐⭐</div>

        <h2>نتيجتك</h2>

        <p style="font-size:25px;">
            <span id="finalScore">0</span> من 20
        </p>

        <p id="message" style="font-size:20px;"></p>

        <button class="restart" onclick="restartGame()">
            🔄 العب مرة أخرى
        </button>

    </div>

</div>

<script>

const questions = [
    {
        word: "Apple",
        correct: "تفاحة",
        answers: ["تفاحة", "سيارة", "كتاب", "مدرسة"]
    },
    {
        word: "Book",
        correct: "كتاب",
        answers: ["قلم", "كتاب", "كرسي", "باب"]
    },
    {
        word: "House",
        correct: "منزل",
        answers: ["منزل", "حديقة", "طاولة", "شارع"]
    },
    {
        word: "School",
        correct: "مدرسة",
        answers: ["مستشفى", "مدرسة", "متجر", "مطار"]
    },
    {
        word: "Water",
        correct: "ماء",
        answers: ["حليب", "عصير", "ماء", "خبز"]
    },
    {
        word: "Sun",
        correct: "شمس",
        answers: ["قمر", "شمس", "نجمة", "سحابة"]
    },
    {
        word: "Moon",
        correct: "قمر",
        answers: ["شمس", "قمر", "بحر", "جبل"]
    },
    {
        word: "Cat",
        correct: "قطة",
        answers: ["كلب", "قطة", "حصان", "سمكة"]
    },
    {
        word: "Dog",
        correct: "كلب",
        answers: ["قطة", "طائر", "كلب", "أرنب"]
    },
    {
        word: "Car",
        correct: "سيارة",
        answers: ["دراجة", "طائرة", "سيارة", "قطار"]
    },
    {
        word: "Teacher",
        correct: "معلم",
        answers: ["طبيب", "معلم", "مهندس", "شرطي"]
    },
    {
        word: "Doctor",
        correct: "طبيب",
        answers: ["طبيب", "معلم", "سائق", "مزارع"]
    },
    {
        word: "Friend",
        correct: "صديق",
        answers: ["أخ", "صديق", "جار", "أب"]
    },
    {
        word: "Big",
        correct: "كبير",
        answers: ["صغير", "طويل", "كبير", "قصير"]
    },
    {
        word: "Small",
        correct: "صغير",
        answers: ["كبير", "صغير", "سريع", "قوي"]
    },
    {
        word: "Happy",
        correct: "سعيد",
        answers: ["حزين", "غاضب", "سعيد", "خائف"]
    },
    {
        word: "Fast",
        correct: "سريع",
        answers: ["بطيء", "سريع", "ضعيف", "قصير"]
    },
    {
        word: "Beautiful",
        correct: "جميل",
        answers: ["قبيح", "جميل", "قديم", "صغير"]
    },
    {
        word: "Food",
        correct: "طعام",
        answers: ["طعام", "ماء", "ملابس", "كتاب"]
    },
    {
        word: "Morning",
        correct: "صباح",
        answers: ["ليل", "مساء", "صباح", "ظهر"]
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("word").textContent = q.word;
    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("score").textContent = score;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    document.getElementById("nextBtn").style.display = "none";

    let shuffled = [...q.answers].sort(() => Math.random() - 0.5);

    shuffled.forEach(answer => {

        const button = document.createElement("button");

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(button, answer);
        };

        answersDiv.appendChild(button);
    });
}

function checkAnswer(button, answer) {

    if (answered) return;

    answered = true;

    const correct = questions[currentQuestion].correct;

    const buttons = document.querySelectorAll("#answers button");

    buttons.forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === correct) {
            btn.classList.add("correct");
        }
    });

    if (answer === correct) {

        button.classList.add("correct");
        score++;

    } else {

        button.classList.add("wrong");
    }

    document.getElementById("score").textContent = score;

    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        showResult();
    } else {
        loadQuestion();
    }
}

function showResult() {

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";

    document.getElementById("finalScore").textContent = score;

    let stars = "";

    if (score >= 18) {
        stars = "⭐⭐⭐⭐⭐";
        document.getElementById("message").textContent =
            "ممتاز! أنت رائع في اللغة الإنجليزية! 🏆";
    }
    else if (score >= 14) {
        stars = "⭐⭐⭐⭐";
        document.getElementById("message").textContent =
            "أحسنت! نتيجة رائعة! 👏";
    }
    else if (score >= 10) {
        stars = "⭐⭐⭐";
        document.getElementById("message").textContent =
            "جيد جدًا! استمر في التعلم! 💪";
    }
    else {
        stars = "⭐⭐";
        document.getElementById("message").textContent =
            "حاول مرة أخرى وستتحسن! 📚";
    }

    document.getElementById("stars").textContent = stars;
}

function restartGame() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("resultScreen").style.display = "none";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
