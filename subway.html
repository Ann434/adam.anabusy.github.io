
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجري 🚂</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(#72c7ff, #dff6ff 45%, #777 45%);
    }

    /* المدينة */
    .city {
        position: absolute;
        bottom: 45%;
        width: 100%;
        height: 30%;
        background:
            linear-gradient(
                to top,
                #666 0 15%,
                #888 15% 100%
            );
    }

    .building {
        position: absolute;
        bottom: 15%;
        width: 90px;
        background: #555;
        border: 3px solid #333;
    }

    .building:nth-child(1) {
        left: 5%;
        height: 150px;
    }

    .building:nth-child(2) {
        left: 28%;
        height: 210px;
        width: 110px;
    }

    .building:nth-child(3) {
        left: 58%;
        height: 175px;
        width: 100px;
    }

    .building:nth-child(4) {
        left: 82%;
        height: 230px;
        width: 105px;
    }

    /* الطريق */
    .road {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 55%;
        background: #3d3d3d;
        clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
    }

    .rail {
        position: absolute;
        bottom: 0;
        width: 8px;
        height: 100%;
        background: #ccc;
    }

    .rail.left {
        left: 35%;
    }

    .rail.right {
        left: 65%;
    }

    .road-line {
        position: absolute;
        bottom: 0;
        width: 5px;
        height: 100%;
        background: repeating-linear-gradient(
            to bottom,
            white 0 45px,
            transparent 45px 85px
        );
        opacity: 0.45;
    }

    .road-line.left {
        left: 50%;
    }

    /* اللاعب */
    #player {
        position: absolute;
        width: 55px;
        height: 75px;
        background: #1976d2;
        border: 4px solid #0d47a1;
        border-radius: 15px;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }

    #player::before {
        content: "🙂";
        position: absolute;
        font-size: 35px;
        top: 5px;
        left: 7px;
    }

    /* العملات */
    .coin {
        position: absolute;
        width: 28px;
        height: 28px;
        background: gold;
        border: 4px solid #d89d00;
        border-radius: 50%;
        z-index: 5;
        box-shadow: 0 0 10px gold;
    }

    /* القطارات والعوائق */
    .train {
        position: absolute;
        width: 75px;
        height: 125px;
        background: #d32f2f;
        border: 5px solid #8b0000;
        border-radius: 8px 8px 12px 12px;
        z-index: 6;
    }

    .train::before {
        content: "";
        position: absolute;
        top: 12px;
        left: 10px;
        right: 10px;
        height: 38px;
        background: #83d8ff;
        border: 3px solid #222;
        border-radius: 5px;
    }

    .train::after {
        content: "🚨";
        position: absolute;
        bottom: 8px;
        left: 20px;
        font-size: 20px;
    }

    /* المعلومات */
    #scoreBox {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 20;
        background: rgba(0,0,0,0.65);
        color: white;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
    }

    #startScreen,
    #gameOver {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,0.72);
        color: white;
        z-index: 100;
        text-align: center;
    }

    #gameOver {
        display: none;
    }

    h1 {
        font-size: 42px;
        margin: 10px;
    }

    button {
        padding: 15px 35px;
        border: none;
        border-radius: 15px;
        background: #ffca28;
        color: #222;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
    }

    .controls {
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.8;
    }
</style>
</head>

<body>

<div id="game">

    <div class="city">
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
    </div>

    <div class="road">
        <div class="rail left"></div>
        <div class="rail right"></div>
        <div class="road-line left"></div>
        <div class="road-line right"></div>
    </div>

    <div id="scoreBox">
        النقاط: <span id="score">0</span>
        <br>
        العملات: <span id="coins">0</span>
        برمجت ادم
    </div>

    <div id="player"></div>

    <div id="startScreen">
        <h1>🏃 لعبة الجري 🚂</h1>
        <p>اهرب من القطارات واجمع العملات!</p>
        <button onclick="startGame()">ابدأ اللعب</button>
        <div class="controls">
            ⬅️ ➡️ الحركة<br>
            ⬆️ القفز
        </div>
    </div>

    <div id="gameOver">
        <h1>💥 انتهت اللعبة</h1>
        <h2>النقاط: <span id="finalScore">0</span></h2>
        <button onclick="startGame()">العب مرة أخرى</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");

let lane = 1;
let score = 0;
let coins = 0;
let running = false;
let speed = 5;
let jump = false;

const lanes = ["25%", "50%", "75%"];

function setPlayerLane() {
    player.style.left = lanes[lane];
}

function startGame() {

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    document.querySelectorAll(".coin, .train").forEach(e => e.remove());

    lane = 1;
    score = 0;
    coins = 0;
    speed = 5;
    running = true;

    document.getElementById("score").textContent = score;
    document.getElementById("coins").textContent = coins;

    setPlayerLane();

    gameLoop();
    createObjects();
}

function gameLoop() {

    if (!running) return;

    score++;
    document.getElementById("score").textContent = score;

    if (score % 500 === 0) {
        speed += 0.5;
    }

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e => {

    if (!running) return;

    if (e.key === "ArrowLeft") {
        lane--;
        if (lane < 0) lane = 0;
        setPlayerLane();
    }

    if (e.key === "ArrowRight") {
        lane++;
        if (lane > 2) lane = 2;
        setPlayerLane();
    }

    if (e.key === "ArrowUp") {
        jumpPlayer();
    }
});

function jumpPlayer() {

    if (jump) return;

    jump = true;

    player.style.transition = "bottom 0.25s";
    player.style.bottom = "190px";

    setTimeout(() => {
        player.style.bottom = "80px";
    }, 300);

    setTimeout(() => {
        jump = false;
    }, 550);
}

function createObjects() {

    if (!running) return;

    const laneNumber = Math.floor(Math.random() * 3);

    const isCoin = Math.random() < 0.55;

    const object = document.createElement("div");

    if (isCoin) {
        object.className = "coin";
    } else {
        object.className = "train";
    }

    object.style.left = lanes[laneNumber];
    object.style.transform = "translateX(-50%)";
    object.style.bottom = "100%";

    game.appendChild(object);

    let position = 100;

    const move = setInterval(() => {

        if (!running) {
            clearInterval(move);
            return;
        }

        position -= speed * 0.7;
        object.style.bottom = position + "%";

        const objectRect = object.getBoundingClientRect();
        const playerRect = player.getBoundingClientRect();

        // تصادم
        if (
            objectRect.left < playerRect.right &&
            objectRect.right > playerRect.left &&
            objectRect.top < playerRect.bottom &&
            objectRect.bottom > playerRect.top
        ) {

            if (isCoin) {

                coins++;
                document.getElementById("coins").textContent = coins;

                object.remove();
                clearInterval(move);

            } else if (!jump) {

                endGame();
                clearInterval(move);
            }
        }

        if (position < -20) {
            object.remove();
            clearInterval(move);
        }

    }, 30);

    setTimeout(createObjects, 700 + Math.random() * 700);
}

function endGame() {

    running = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "flex";
}
</script>

</body>
</html>
