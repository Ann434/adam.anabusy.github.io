
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اضغط على الهدف 🎯</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
}

h1 {
    margin: 20px 0 10px;
    font-size: 38px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 15px;
}

.box {
    background: rgba(255,255,255,0.12);
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 20px;
}

button {
    border: none;
    background: #00c853;
    color: white;
    padding: 12px 25px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: #00a844;
}

#game {
    position: relative;
    width: 90%;
    max-width: 900px;
    height: 500px;
    margin: 20px auto;
    background: #eeeeee;
    border: 5px solid white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

#target {
    position: absolute;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: radial-gradient(circle,
        white 0 12%,
        red 13% 35%,
        white 36% 55%,
        red 56% 100%);
    border: 3px solid #222;
    cursor: pointer;
    display: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

#message {
    font-size: 24px;
    font-weight: bold;
    margin: 10px;
}

.level {
    color: #ffd600;
}
</style>
</head>

<body>

<h1>🎯 اضغط على الهدف</h1>

<div class="info">
    <div class="box">النقاط: <span id="score">0</span></div>
    <div class="box">الوقت: <span id="time">30</span></div>
    <div class="box">المستوى: <span id="level">1</span></div>
</div>

<button onclick="startGame()">▶ ابدأ اللعبة</button>

<div id="message">اضغط على ابدأ للعب!</div>

<div id="game">
    <div id="target"></div>
</div>

<script>
const game = document.getElementById("game");
const target = document.getElementById("target");

let score = 0;
let time = 30;
let level = 1;
let timer;
let playing = false;

function startGame() {

    clearInterval(timer);

    score = 0;
    time = 30;
    level = 1;
    playing = true;

    document.getElementById("score").textContent = score;
    document.getElementById("time").textContent = time;
    document.getElementById("level").textContent = level;
    document.getElementById("message").textContent = "🎯 اضغط على الهدف بسرعة!";

    target.style.display = "block";

    moveTarget();

    timer = setInterval(() => {

        time--;

        document.getElementById("time").textContent = time;

        if (time <= 0) {
            endGame();
        }

    }, 1000);
}

function moveTarget() {

    if (!playing) return;

    const gameWidth = game.clientWidth;
    const gameHeight = game.clientHeight;

    const size = Math.max(35, 65 - level * 3);

    target.style.width = size + "px";
    target.style.height = size + "px";

    const x = Math.random() * (gameWidth - size) + size / 2;
    const y = Math.random() * (gameHeight - size) + size / 2;

    target.style.left = x + "px";
    target.style.top = y + "px";
}

target.addEventListener("click", function() {

    if (!playing) return;

    score++;

    document.getElementById("score").textContent = score;

    // كل 10 نقاط ينتقل اللاعب إلى مستوى جديد
    level = Math.floor(score / 10) + 1;

    document.getElementById("level").textContent = level;

    moveTarget();
});

function endGame() {

    playing = false;

    clearInterval(timer);

    target.style.display = "none";

    document.getElementById("message").textContent =
        "🏆 انتهى الوقت! نتيجتك: " + score + " نقطة";

    alert("🎯 انتهت اللعبة!\n\nنقاطك: " + score);
}
</script>

</body>
</html>
